[package]
name = "diskexplorer"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
jwalk = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
blake3 = "1.8.7"
trash = "5.2.9"
open = "5"
rayon = "1.12"
windows = { version = "0.62", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Wdk_Storage_FileSystem",
    "Wdk_Foundation",
    "Wdk_System_IO",
] }

[dev-dependencies]
dirs = "7.0.0"
whoami = "1.5"
num_cpus = "1.17"
